<!DOCTYPE html>
<html lang="es">
<head>

  <header class="site-header" style="background:var(--bg-dark,#0d1117);border-bottom:1px solid #30363d;padding:14px 24px;position:sticky;top:0;z-index:10;">
    <div style="max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;">
